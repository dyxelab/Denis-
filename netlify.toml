# Netlify: build the Weronika Rużyła site (static export) from its own folder.
[build]
  base = "weronika-ruzyla"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# long cache for fingerprinted assets and media
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
